<html lang="th">
<head>

<style>
:root{padding-top:env(safe-area-inset-top,0px)}
/* Layout: one-screen phone app, scrolling content above a floating pill tab bar */
:root{
  --bg:#05070B; --card:#15171C; --card2:#1E2128; --line:#2A2D35;
  --fg:#F2F3F7; --muted:#9BA0AD; --accent:#3B82F6; --accent2:#60A5FA;
  --hero1:#1E40AF; --hero2:#0F1626; --warn:#FB923C; --bad:#F87171; --good:#4ADE80;
  --font:'IBM Plex Sans Thai',-apple-system,'Sukhumvit Set',system-ui,sans-serif;
  color-scheme:dark;
}
.hl{color:var(--hl)}
:root{--hl:#BFDBFE}
body[data-th="purple"]{--accent:#8B5CF6;--accent2:#C4B5FD;--hero1:#5B21B6;--hero2:#1A1030;--hl:#DDD6FE}
body[data-th="green"]{--accent:#10B981;--accent2:#6EE7B7;--hero1:#047857;--hero2:#0B1F18;--hl:#A7F3D0}
body[data-th="pink"]{--accent:#EC4899;--accent2:#F9A8D4;--hero1:#9D174D;--hero2:#24101B;--hl:#FBCFE8}
body[data-th="orange"]{--accent:#F97316;--accent2:#FDBA74;--hero1:#C2410C;--hero2:#26150B;--hl:#FED7AA}
body[data-th="midnight"]{--accent:#64748B;--accent2:#CBD5E1;--hero1:#334155;--hero2:#0B0F17;--hl:#E2E8F0}
*{box-sizing:border-box}
html,body{min-height:100%}
body{background:var(--bg);color:var(--fg);font-family:var(--font);font-size:15px;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  padding-block:0 calc(110px + env(safe-area-inset-bottom,0px));-webkit-tap-highlight-color:transparent}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
.wrap{max-width:520px;margin:0 auto;padding-bottom:24px;display:flex;flex-direction:column;gap:16px;padding-top:20px}
h1{font-size:32px;margin:8px 0 0;font-weight:700}
h2{font-size:19px;margin:8px 0 0;font-weight:700}
.muted{color:var(--muted)}
.num{font-variant-numeric:tabular-nums}
.hero{border-radius:24px;padding:20px;background:linear-gradient(135deg,var(--hero1),var(--hero2));border:1px solid color-mix(in srgb,var(--hero1) 60%,transparent);display:flex;flex-direction:column;gap:10px}
.hero .big{font-size:40px;font-weight:700;line-height:1.1}
.card{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:16px;display:flex;flex-direction:column;gap:12px}
.bar{height:8px;border-radius:4px;background:var(--card2);overflow:hidden}
.bar>i{display:block;height:100%;background:var(--accent);border-radius:4px}
.row{display:flex;justify-content:space-between;align-items:center;gap:8px 12px;flex-wrap:wrap;min-width:0}
.row.nowrap{flex-wrap:nowrap}
html,body{overflow-x:hidden}
.card,.list,.hero{min-width:0;max-width:100%}
.list{background:var(--card);border:1px solid var(--line);border-radius:20px;overflow:hidden}
.item{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:14px 16px;border-top:1px solid var(--line)}
.item:first-child{border-top:0}
.item .t{font-weight:500}.item .s{font-size:12px;color:var(--muted)}
.grid3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.mini{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:12px;text-align:left;color:var(--fg);font:inherit;cursor:pointer}
.mini b{display:block;font-size:18px}
.mini span{font-size:12px;color:var(--muted)}
input,select{width:100%;height:46px;border-radius:12px;border:1px solid var(--line);background:var(--card2);color:var(--fg);font:inherit;font-size:16px;padding:0 14px}
label{display:flex;flex-direction:column;gap:6px;font-size:13px;color:var(--muted)}
.f2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
button{font:inherit;cursor:pointer}
.btn{height:46px;border-radius:12px;border:0;background:var(--accent);color:#fff;font-weight:600;padding:0 16px}
.btn.ghost{background:var(--card2);color:var(--fg)}
.btn.sm{height:34px;font-size:13px;padding:0 12px;border-radius:10px}
button:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--accent2);outline-offset:2px}
.seg{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:4px;padding:4px;background:var(--card);border-radius:14px}
.seg button{height:40px;border:0;border-radius:10px;background:transparent;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--card2);color:var(--fg);font-weight:600}
.chip{display:inline-block;padding:3px 10px;border-radius:10px;background:#1E3A5F;color:var(--hl);font-size:12px}
.chip.w{background:#3B2414;color:#FDBA74}.chip.b{background:#3F1A1A;color:#FCA5A5}
.avatar{width:38px;height:38px;border-radius:19px;background:#1E3A5F;display:flex;align-items:center;justify-content:center;font-weight:700;flex:none}
.tabbar{position:fixed;left:max(16px,env(safe-area-inset-left,0px));right:max(16px,env(safe-area-inset-right,0px));bottom:calc(12px + env(safe-area-inset-bottom,0px));
  max-width:520px;margin:0 auto;display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:2px;padding:6px;border-radius:28px;
  background:rgba(28,30,36,.92);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);border:1px solid var(--line);z-index:20}
.tabbar button{height:54px;font-size:11px;border:0;border-radius:22px;background:transparent;color:var(--muted);font-size:12px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px}
.tabbar button[aria-selected="true"]{background:color-mix(in srgb,var(--accent) 22%,#1C1E24);color:var(--accent2)}
.tabbar svg{width:22px;height:22px}
.etile{width:40px;height:40px;border-radius:12px;background:var(--card2);display:flex;align-items:center;justify-content:center;font-size:21px;flex:none}
.cgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(96px,1fr));gap:10px}
.ctile{position:relative;background:var(--card2);border:1px solid var(--line);border-radius:16px;padding:12px 8px 10px;display:flex;flex-direction:column;align-items:center;gap:4px;min-width:0}
.ctile .em{font-size:30px;line-height:1;background:none;border:0;padding:4px;border-radius:10px;cursor:pointer}
.ctile .nm{font-size:13px;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ctile .x{position:absolute;top:4px;right:4px;width:24px;height:24px;border-radius:12px;border:0;background:#3A3D45;color:var(--fg);font-size:13px}
.epal{display:grid;grid-template-columns:repeat(auto-fill,minmax(44px,1fr));gap:6px}
.epal button{height:44px;border-radius:12px;border:1px solid var(--line);background:var(--card2);font-size:22px}
.epal button[aria-pressed="true"]{border-color:var(--accent);background:#1E3A5F}
.thgrid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.thbtn{height:64px;border-radius:14px;border:2px solid transparent;color:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;font-size:13px}
.thbtn[aria-pressed="true"]{border-color:#fff}
.exp{padding:14px 16px}
.editor{display:flex;flex-direction:column;gap:10px;padding:4px 16px 16px;border-top:1px dashed var(--line);background:color-mix(in srgb,var(--card2) 50%,var(--card))}
.daybar .btn{width:44px;padding:0;font-size:22px}
.seg4{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:4px;padding:4px;background:var(--card);border-radius:14px;border:1px solid var(--line)}
.seg4 button{height:38px;border:0;border-radius:10px;background:transparent;color:var(--muted);font-size:14px}
.seg4 button[aria-pressed="true"]{background:var(--accent);color:#fff;font-weight:600}
.kpi{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.kpi .card{gap:4px}.kpi b{font-size:22px}
.cbar{height:10px;border-radius:5px;background:var(--card2);overflow:hidden}.cbar i{display:block;height:100%;background:var(--accent);border-radius:5px}
.ins{display:flex;align-items:center;gap:12px}.ins .etile{width:46px;height:46px;font-size:24px}
.sample{font-size:12px;color:var(--warn)}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(96px + env(safe-area-inset-bottom,0px));background:var(--card2);border:1px solid var(--line);padding:10px 16px;border-radius:14px;z-index:30}
table{width:100%;border-collapse:collapse;font-size:13px}
th,td{padding:9px 6px;text-align:right;border-top:1px solid var(--line);white-space:nowrap}
th:first-child,td:first-child{text-align:left;position:sticky;left:0;background:var(--card);z-index:1;white-space:normal;min-width:64px}
tr[style] td:first-child{background:#13233F}
table{font-size:12.5px}
th{color:var(--muted);font-weight:500;border-top:0}
.scroll{overflow-x:auto}
textarea{width:100%;min-height:90px;border-radius:12px;border:1px solid var(--line);background:var(--card2);color:var(--fg);font:inherit;font-size:13px;padding:10px}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>

</head>

<script>
const KEY='kraopaojod.v1';
const thd=d=>new Date(d+'T00:00').toLocaleDateString('th-TH',{day:'numeric',month:'short',year:'2-digit'});
const fmt0=n=>'฿'+Math.round(n).toLocaleString('th-TH');
const fmt=n=>'฿'+(Math.round(n*100)/100).toLocaleString('th-TH',{minimumFractionDigits:0,maximumFractionDigits:2});
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const today=()=>{const d=new Date();return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`};
const daysSince=d=>Math.max(0,Math.floor((Date.now()-new Date(d))/864e5));
const uid=()=>Math.random().toString(36).slice(2,9);

function sample(){
  const d=n=>new Date(Date.now()-n*864e5).toISOString().slice(0,10);
  return {sample:true,budget:20000,tab:'home',strategy:'avalanche',payBudget:5000,
    expenses:[{id:uid(),title:'กาแฟ',amt:60,date:d(0)},{id:uid(),title:'ข้าวมันไก่',amt:50,date:d(0)},{id:uid(),title:'ชาบู (ส่วนของฉัน)',amt:400,date:d(1)},{id:uid(),title:'ค่าน้ำมัน',amt:1200,date:d(3)}],
    ious:[{id:uid(),name:'ต้น',note:'ชาบู',amt:400,paid:0,date:d(1)},{id:uid(),name:'ต้น',note:'หมูกระทะ',amt:450,paid:0,date:d(9)},{id:uid(),name:'มิว',note:'ชาบู',amt:400,paid:0,date:d(1)},{id:uid(),name:'พี่เอ',note:'แท็กซี่',amt:800,paid:200,date:d(16)}],
    cards:[{id:uid(),name:'บัตร A',bal:22500,limit:30000,apr:16,minPct:8,due:25},{id:uid(),name:'บัตร B',bal:15700,limit:40000,apr:16,minPct:8,due:2},{id:uid(),name:'บัตรห้าง C',bal:10000,limit:20000,apr:20,minPct:10,due:10}]};
}
let S;
try{S=JSON.parse(localStorage.getItem(KEY))}catch(e){}
if(!S||!S.expenses)S=sample();
const DEF={alertPct:80,cycleDay:1,cats:['อาหาร','เดินทาง','ช้อปปิ้ง','บิล','สุขภาพ','บันเทิง','อื่นๆ'],remindOn:true,remindTime:'20:00',theme:'blue',catIcons:{'อาหาร':'🍜','เดินทาง':'🚕','ช้อปปิ้ง':'🛍️','บิล':'🧾','สุขภาพ':'💊','บันเทิง':'🎬','อื่นๆ':'📦'}};
for(const k in DEF)if(S[k]==null)S[k]=Array.isArray(DEF[k])?[...DEF[k]]:(typeof DEF[k]==='object'?{...DEF[k]}:DEF[k]);
const EMOJI=['🍜','🍔','☕','🧋','🍺','🛒','🛍️','👕','💄','🚕','🚇','⛽','🚗','✈️','🏠','💡','📱','🧾','💊','🏥','💪','🎬','🎮','🎵','📚','🎓','🐶','👶','🎁','💸','💳','🏦','📦','✨'];
function fixIcons(){S.catIcons=S.catIcons||{};for(const k in DEF.catIcons)if(!S.catIcons[k])S.catIcons[k]=DEF.catIcons[k]}
fixIcons();
const ico=c=>(S.catIcons||{})[c]||'📦';
let editCat=null,newEmoji='✨',editExp=null;
if(!S.selDate)S.selDate=today();
/* รูปเก็บใน IndexedDB (พื้นที่ใหญ่กว่า localStorage มาก) */
const PKEY='kraopaojod.photos';let PH={};
const idb=new Promise(ok=>{try{const r=indexedDB.open('kraopaojod',1);r.onupgradeneeded=()=>r.result.createObjectStore('photos');r.onsuccess=()=>ok(r.result);r.onerror=()=>ok(null)}catch(e){ok(null)}});
const tx=(mode,fn)=>idb.then(db=>db?new Promise(ok=>{const t=db.transaction('photos',mode),st=t.objectStore('photos');const res=fn(st);t.oncomplete=()=>ok(res&&res.result!==undefined?res.result:true);t.onerror=()=>ok(false)}):false);
const putPhoto=(id,u)=>tx('readwrite',st=>st.put(u,id));
const delPhoto=id=>tx('readwrite',st=>st.delete(id));
function savePH(){return true}
idb.then(async db=>{
  // ย้ายรูปเก่าจาก localStorage มาไว้ใน IndexedDB
  try{const old=JSON.parse(localStorage.getItem(PKEY)||'null');if(old&&db){for(const k in old)await putPhoto(k,old[k]);localStorage.removeItem(PKEY)}}catch(e){}
  if(!db)return;
  const t=db.transaction('photos','readonly'),st=t.objectStore('photos'),cur=st.openCursor();
  cur.onsuccess=()=>{const c=cur.result;if(c){PH[c.key]=c.value;c.continue()}else render()};
});
try{navigator.storage&&navigator.storage.persist&&navigator.storage.persist()}catch(e){}
const addDays=(d,n)=>{const x=new Date(d+'T00:00');x.setDate(x.getDate()+n);return iso(x)};
const dLabel=d=>d===today()?'วันนี้':d===addDays(today(),-1)?'เมื่อวาน':new Date(d+'T00:00').toLocaleDateString('th-TH',{weekday:'short',day:'numeric',month:'short'});
function compress(file){return new Promise((ok,no)=>{const r=new FileReader();r.onload=()=>{const im=new Image();im.onload=()=>{const k=Math.min(1,560/Math.max(im.width,im.height)),c=document.createElement('canvas');c.width=im.width*k;c.height=im.height*k;c.getContext('2d').drawImage(im,0,0,c.width,c.height);ok(c.toDataURL('image/jpeg',.6))};im.onerror=no;im.src=r.result};r.onerror=no;r.readAsDataURL(file)})}
function splitExpense(e,names){
  names=names.filter(Boolean);if(!names.length)return 0;
  const total=e.full||e.amt,each=Math.round(total/(names.length+1)*100)/100;
  e.full=total;e.amt=Math.round((total-each*names.length)*100)/100;e.split=(e.split||[]).concat(names);
  names.forEach(n=>S.ious.unshift({id:uid(),name:n,note:e.title,amt:each,paid:0,date:e.date,exp:e.id}));
  return each;
}
function cycleStart(){const n=new Date(),d=Math.min(S.cycleDay,28);let s=new Date(n.getFullYear(),n.getMonth(),d);if(n<s)s=new Date(n.getFullYear(),n.getMonth()-1,d);return s}
const iso=d=>`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
function save(){try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}if(S.gsUrl&&S.gsAuto!==false&&!S.sample){clearTimeout(save.t);save.t=setTimeout(()=>syncSheets(false),4000)}}
async function syncSheets(manual){
  if(!S.gsUrl){if(manual)toast('ใส่ลิงก์เว็บแอปก่อน');return}
  const body={secret:S.gsSecret||'',expenses:S.expenses.map(e=>({date:e.date,title:e.title,cat:e.cat||guessCat(e.title),amt:e.amt,full:e.full||'',split:(e.split||[]).join(' '),note:e.note||''})),ious:S.ious.map(i=>({name:i.name,note:i.note,date:i.date,amt:i.amt,paid:i.paid||0}))};
  const url=S.gsUrl.replace(/\s+/g,'');
  if(!/^https:\/\/script\.google\.com\/macros\/s\/[\w-]+\/exec$/.test(url)){if(manual)toast('ลิงก์ไม่ถูกต้อง ต้องขึ้นต้น https://script.google.com/macros/s/ และลงท้าย /exec');return}
  const payload=JSON.stringify(body);
  try{let ok=false;try{ok=navigator.sendBeacon&&navigator.sendBeacon(url,new Blob([payload],{type:'text/plain;charset=utf-8'}))}catch(e){}
    if(!ok)await fetch(url,{method:'POST',mode:'no-cors',headers:{'Content-Type':'text/plain;charset=utf-8'},body:payload});
    S.gsLast=new Date().toISOString();try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}if(manual)toast('ส่งข้อมูลไป Google Sheets แล้ว');if(S.tab==='settings')render()}
  catch(e){if(manual)toast('ส่งไม่สำเร็จ เช็กอินเทอร์เน็ตหรือลิงก์อีกครั้ง')}
}
function toast(m){const t=document.createElement('div');t.className='toast';t.textContent=m;document.body.appendChild(t);setTimeout(()=>t.remove(),1800)}

/* "กาแฟ 60 ข้าวมันไก่ 50 ชาบู 1600 หาร ต้น มิว" */
function parseQuick(text){
  let splitNames=[];
  const m=text.match(/หาร(?:กับ)?\s+(.+)$/);
  if(m){splitNames=m[1].split(/\s*(?:,|และ|กับ|\s)\s*/).filter(Boolean);text=text.slice(0,m.index)}
  const items=[];const rx=/([^\d]+?)\s*(\d[\d,]*(?:\.\d+)?)/g;let r;
  while((r=rx.exec(text)))items.push({title:r[1].trim(),amt:parseFloat(r[2].replace(/,/g,''))});
  return {items,splitNames};
}
function addQuick(text){

    if(last){

      S.expenses.unshift({id:uid(),cat:guessCat(it.title),title:it.title+' (ส่วนของฉัน)',amt:Math.round((it.amt-each*splitNames.length)*100)/100,full:it.amt,split:splitNames,date:S.selDate});

function monthSpend(){const st=iso(cycleStart());return S.expenses.filter(e=>e.date>=st).reduce((a,e)=>a+e.amt,0)}
function iouLeft(){return S.ious.reduce((a,i)=>a+Math.max(0,i.amt-i.paid),0)}
function cardMin(c){return c.bal<=0?0:Math.min(c.bal,Math.max(c.bal*c.minPct/100,500))}

function plan(cards,budget,strategy){
  let ds=cards.filter(c=>c.bal>0).map(c=>({...c}));const rows=[];let interest=0;
  for(let m=0;m<600&&ds.some(d=>d.bal>0.005);m++){
    let left=budget,mi=0;const pay={};
    ds.forEach(d=>{if(d.bal>0){const i=d.bal*d.apr/1200;d.bal+=i;mi+=i}});
    ds.forEach(d=>{if(d.bal>0){const p=Math.min(cardMin(d),left);d.bal-=p;left-=p;pay[d.id]=p}});
    if(left<0)return null;
    ds.filter(d=>d.bal>0).sort((a,b)=>strategy==='avalanche'?b.apr-a.apr:a.bal-b.bal).forEach(d=>{const p=Math.min(left,d.bal);d.bal-=p;left-=p;pay[d.id]=(pay[d.id]||0)+p});
    interest+=mi;const rem=ds.reduce((a,d)=>a+Math.max(0,d.bal),0);
    if(rows.length&&rem>=rows[rows.length-1].rem-0.01)return null;
    rows.push({m,pay,rem,closed:ds.filter(d=>d.bal<=0.005&&pay[d.id]>0).map(d=>d.name)});
  }
  return {rows,interest};
}

/* ---------- ดึงสลิปจาก Shortcut: ?slip=ข้อความที่ iPhone อ่านจากรูป (หลายใบคั่นด้วย =====) ---------- */
let slip={busy:false,msg:'',items:[],dup:0};
const TH_M={'ม.ค.':1,'ก.พ.':2,'มี.ค.':3,'เม.ย.':4,'พ.ค.':5,'มิ.ย.':6,'ก.ค.':7,'ส.ค.':8,'ก.ย.':9,'ต.ค.':10,'พ.ย.':11,'ธ.ค.':12};
const KW=['โอนเงินสำเร็จ','ชำระเงินสำเร็จ','จ่ายบิลสำเร็จ','รายการสำเร็จ','จำนวนเงิน','เลขที่รายการ','รหัสอ้างอิง','ค่าธรรมเนียม','Transfer','Successful','Amount'];

  let amount=null;const ai=lines.findIndex(l=>/จำนวนเงิน|amount/i.test(l));
  if(ai>=0)for(const l of lines.slice(ai,ai+3)){const v=vals(l);if(v.length){amount=v[0];break}}
  if(amount==null){const v=lines.flatMap(vals).filter(x=>x>0);amount=v.length?Math.max(...v):null}
  if(!(amount>0))return null;

  let payee='';const pi=lines.findIndex(l=>/^(ไปยัง|ถึง|ไปที่|To|ผู้รับ|ชื่อผู้รับ|ร้านค้า|Merchant)\s*:?\s*/i.test(l));
  const junk=l=>/[\dX]{3,}[-\s]?[\dX]|บัญชี|ธนาคาร|bank|พร้อมเพย์|promptpay|จำนวน|บาท|โอนเงิน|สำเร็จ|ค่าธรรมเนียม|เลขที่|รหัส|วันที่|\d{1,2}:\d{2}/i.test(l);
  if(pi>=0){const same=lines[pi].replace(/^(ไปยัง|ถึง|ไปที่|To|ผู้รับ|ชื่อผู้รับ|ร้านค้า|Merchant)\s*:?\s*/i,'').trim();payee=same&&!junk(same)?same:(lines.slice(pi+1,pi+4).find(l=>!junk(l))||'')}
  if(!payee){const named=lines.filter(l=>/^(นาย|นาง|น\.ส\.|นางสาว|ด\.ช\.|ด\.ญ\.|MR\.?|MRS\.?|MS\.?|MISS|บริษัท|บจก|หจก|ร้าน)\s*/i.test(l));if(named.length)payee=named[named.length>1?1:0]}
  if(!payee){const ai2=lines.findIndex(l=>/จำนวนเงิน|amount/i.test(l));const cand=lines.slice(0,ai2>0?ai2:lines.length).filter(l=>!junk(l)&&!/^[A-Z\s+]{2,12}$/.test(l)&&/[ก-๙A-Za-z]{3,}/.test(l));if(cand.length>=2)payee=cand[cand.length-1]}

  const ref=rm?rm[1]:null;
  return {key:ref?'ref:'+ref:`k:${date}|${time}|${amount}`,amount,date,time,payee:payee.slice(0,60),kind:isPerson?'person':'merchant',category:'อื่นๆ',on:!isPerson};
}
function guessCat(p){p=p||'';const r=(S.rules||{})[p];if(r)return r;if(/ยา|หมอ|คลินิก|โรงพยาบาล|ฟิตเนส|fitness|watsons|boots/i.test(p)&&S.cats.includes('สุขภาพ'))return 'สุขภาพ';if(/หนัง|netflix|spotify|youtube|เกม|game|major|sf cinema|คอนเสิร์ต/i.test(p)&&S.cats.includes('บันเทิง'))return 'บันเทิง';if(/shopee|lazada|เสื้อ|รองเท้า|central|uniqlo|ช้อป|lotus|big ?c|makro/i.test(p)&&S.cats.includes('ช้อปปิ้ง'))return 'ช้อปปิ้ง';if(/อาหาร|ข้าว|ชาบู|หมูกระทะ|ก๋วยเตี๋ยว|ส้มตำ|ชานม|คาเฟ่|กาแฟ|coffee|café|food|grab ?food|lineman|7-?eleven|เซเว่น/i.test(p))return 'อาหาร';if(/bts|mrt|taxi|แท็กซี่|วิน|รถ|grab|bolt|ปตท|ptt|น้ำมัน|shell|bangchak/i.test(p))return 'เดินทาง';if(/ไฟฟ้า|ประปา|ค่าเน็ต|ค่าโทร|ค่าเช่า|ค่าห้อง|true|ais|dtac|3bb|internet/i.test(p))return 'บิล';return 'อื่นๆ'}

}
function slipCard(){
  const it=slip.items;
  const pick=`<label class="btn" style="display:flex;align-items:center;justify-content:center;gap:6px;color:#fff;cursor:pointer;width:100%">📸 เลือกสลิปจากคลังรูป<input id="slipPick" type="file" accept="image/*" multiple hidden></label><a class="btn ghost" href="shortcuts://run-shortcut?name=${encodeURIComponent('ดึงสลิป')}" style="display:flex;align-items:center;justify-content:center;gap:6px;color:var(--fg);text-decoration:none;width:100%">▶️ รันคำสั่งลัด “ดึงสลิป”</a>`;
  if(ocr.busy)return `<div class="card"><b>📸 กำลังอ่านสลิป</b><div class="bar"><i style="width:${ocr.pct}%"></i></div><span class="muted" style="font-size:13px">${esc(ocr.msg)}</span></div>`;
  if(!it.length&&!slip.msg)return `<div class="card"><b>📸 ดึงสลิป</b>${pick}<span class="muted" style="font-size:12px">เลือกได้หลายรูปพร้อมกัน แอปอ่านสลิปในเครื่อง ไม่ส่งรูปออกไปไหน · หรือใช้ Shortcut “ดึงสลิป” ก็ได้</span></div>`;
  const days=[...new Set(it.map(x=>x.date))].sort().reverse();
  const f=slip.day||'all';
  return `<div class="card"><b>📸 สลิปจาก iPhone</b>${slip.msg?`<div class="muted" style="font-size:13px">${esc(slip.msg)}</div>`:''}
   ${days.length>1?`<div style="display:flex;gap:6px;overflow-x:auto;padding-bottom:2px">${[['all','ทั้งหมด']].concat(days.map(d=>[d,dLabel(d)])).map(([k,n])=>`<button class="btn sm ${f===k?'':'ghost'}" data-slipday="${k}" style="flex:none">${n}${k!=='all'?` (${it.filter(x=>x.date===k).length})`:''}</button>`).join('')}</div>`:''}
   ${it.length?`<div class="row nowrap"><span class="muted" style="font-size:13px">เลือกแล้ว ${it.filter(x=>x.on).length}/${it.length} · ${fmt(it.filter(x=>x.on).reduce((a,x)=>a+x.amount,0))}</span><div class="row nowrap" style="gap:6px"><button class="btn sm ghost" data-selall="1">เลือกทั้งหมด</button><button class="btn sm ghost" data-selall="0">เอาออกทั้งหมด</button></div></div>`:''}
   ${it.length?days.filter(d=>f==='all'||f===d).map(d=>`<div class="row nowrap"><span class="muted" style="font-size:13px;font-weight:600">📅 ${dLabel(d)} · ${fmt(it.filter(x=>x.date===d&&x.on).reduce((a,x)=>a+x.amount,0))}</span>${days.length>1?`<button class="btn sm ghost" data-selday="${d}" style="height:28px;font-size:12px">${it.filter(x=>x.date===d).every(x=>x.on)?'เอาออกทั้งวัน':'เลือกทั้งวัน'}</button>`:''}</div><div class="list">${it.map((s,i)=>s.date!==d?'':`<div class="item" style="flex-direction:column;align-items:stretch;gap:8px">
     <div class="row nowrap"><input type="checkbox" data-slip="${i}" ${s.on?'checked':''} aria-label="เลือกสลิปนี้" style="width:22px;height:22px;flex:none"><input data-payee="${i}" value="${esc(s.payee)}" placeholder="ไม่ทราบผู้รับ แตะเพื่อพิมพ์ชื่อ" aria-label="ชื่อผู้รับ" style="height:36px;font-size:15px;flex:1;min-width:0;${s.payee?'':'border-color:var(--warn)'}"><b class="num" style="flex:none">${fmt(s.amount)}</b></div>
     <div class="row nowrap" style="gap:6px"><span class="s" style="flex:none">${esc(s.time||'')}${s.kind==='person'?' · <span style="color:var(--warn)">บุคคล</span>':''}</span><select data-cat="${i}" aria-label="หมวด" style="height:32px;flex:1;min-width:0;font-size:13px;padding:0 6px">${S.cats.map(c=>`<option value="${esc(c)}"${c===s.category?' selected':''}>${ico(c)} ${esc(c)}</option>`).join('')}</select><input data-sp="${i}" value="${esc(s.splitWith||'')}" placeholder="👥 หารกับ" aria-label="หารกับเพื่อน" style="height:32px;flex:1;min-width:0;font-size:13px"></div>
     ${s.splitWith?`<span class="s">หาร ${s.splitWith.trim().split(/\s+/).length+1} คน · ส่วนของฉัน ${fmt(s.amount/(s.splitWith.trim().split(/\s+/).length+1))}</span>`:''}</div>`).join('')}</div>`).join('')+`
   <div class="row"><span class="muted" style="font-size:12px">${slip.dup?`ข้าม ${slip.dup} ใบที่เคยบันทึกแล้ว`:'แก้ชื่อผู้รับ หรือใส่ชื่อเพื่อนที่หารได้เลย'}</span><div class="row"><button class="btn sm ghost" data-act="slipCancel">ข้าม</button><button class="btn sm" data-act="slipSave">บันทึก ${it.filter(s=>s.on).length}</button></div></div>`:`<button class="btn sm ghost" data-act="slipCancel">ปิด</button>`}</div>`;
}
let ocr={busy:false,pct:0,msg:''};
function loadTess(){return window.Tesseract?Promise.resolve():new Promise((ok,no)=>{const sc=document.createElement('script');sc.src='https://cdn.jsdelivr.net/npm/tesseract.js@5.1.1/dist/tesseract.min.js';sc.onload=ok;sc.onerror=no;document.head.appendChild(sc)})}
function prepImg(file){return new Promise((ok,no)=>{const u=URL.createObjectURL(file),im=new Image();im.onload=()=>{const k=Math.min(2,1600/Math.max(im.width,im.height)),c=document.createElement('canvas');c.width=im.width*k;c.height=im.height*k;const x=c.getContext('2d');x.filter='grayscale(1) contrast(1.4)';x.drawImage(im,0,0,c.width,c.height);URL.revokeObjectURL(u);ok(c)};im.onerror=no;im.src=u})}
async function ocrSlips(files){
  files=[...files];if(!files.length)return;
  ocr={busy:true,pct:2,msg:'กำลังเตรียมตัวอ่านสลิป (ครั้งแรกโหลดนานหน่อย)…'};render();
  try{
    await loadTess();
    const w=await Tesseract.createWorker(['tha','eng'],1,{logger:m=>{if(m.status==='recognizing text'){ocr.pct=Math.round((ocr.done+m.progress)/files.length*100);render()}}});
    const texts=[];ocr.done=0;
    for(const f of files){ocr.msg=`กำลังอ่านรูปที่ ${ocr.done+1} จาก ${files.length}`;render();
      try{const c=await prepImg(f);const r=await w.recognize(c);texts.push(r.data.text.replace(/(?<=[ก-๙])\s+(?=[ก-๙])/g,''))}catch(e){texts.push('')}
      ocr.done++}
    await w.terminate();
    ocr={busy:false,pct:0,msg:''};
    location.hash='slip='+encodeURIComponent(texts.join('\n=====\n'));importFromUrl();render();
    if(!slip.items.length&&!slip.msg)toast('ไม่พบสลิปในรูปที่เลือก');
  }catch(e){ocr={busy:false,pct:0,msg:''};render();toast('อ่านสลิปไม่สำเร็จ ต้องต่ออินเทอร์เน็ตตอนใช้ครั้งแรก')}
}
function saveSlips(){
  if(S.sample)clearSample(false);
  S.slipRefs=S.slipRefs||[];S.rules=S.rules||{};let n=0;
  slip.items.forEach(s=>{S.slipRefs.push(s.key);if(s.on){const e={id:uid(),title:s.payee||'สลิปโอนเงิน',amt:s.amount,date:s.date,cat:s.category,time:s.time};S.expenses.unshift(e);if(s.splitWith)splitExpense(e,s.splitWith.trim().split(/[\s,]+/));if(s.payee)S.rules[s.payee]=s.category;n++}});
  S.expenses.sort((a,b)=>a.date<b.date?1:a.date>b.date?-1:0);
  S.slipRefs=S.slipRefs.slice(-2000);
  const lastDay=slip.items.find(x=>x.on)?.date;slip={busy:false,msg:'',items:[],dup:0};if(lastDay)S.selDate=lastDay;save();render();toast(`บันทึกจากสลิป ${n} รายการ`);
}

const app=document.getElementById('app');
function render(){
  document.body.dataset.th=S.theme||'blue';
  app.innerHTML=views[S.tab]();
  document.querySelectorAll('.tabbar button').forEach(b=>b.setAttribute('aria-selected',b.dataset.tab===(S.tab==='plan'?'cards':S.tab)));
}
function go(t){S.tab=t;save();render();window.scrollTo(0,0)}
document.querySelector('.tabbar').addEventListener('click',e=>{const b=e.target.closest('[data-tab]');if(b)go(b.dataset.tab)});
const num=v=>parseFloat(String(v).replace(/[,฿\s]/g,''))||0;

app.addEventListener('click',async e=>{
  const t=e.target.closest('button');if(!t)return;const d=t.dataset;
  if(d.go)go(d.go);
  if(d.act==='clearSample')clearSample();
  if(d.delExp){S.expenses=S.expenses.filter(x=>x.id!==d.delExp);delete PH[d.delExp];delPhoto(d.delExp);editExp=null;save();render()}
  if(d.edit){editExp=editExp===d.edit?null:d.edit;render()}
  if(d.delphoto){delete PH[d.delphoto];delPhoto(d.delphoto);render()}
  if(d.savephoto){const u=PH[d.savephoto];if(u){fetch(u).then(r=>r.blob()).then(b=>{const f=new File([b],'slip-'+d.savephoto+'.jpg',{type:'image/jpeg'});if(navigator.canShare&&navigator.canShare({files:[f]}))navigator.share({files:[f]}).catch(()=>{});else{const a=document.createElement('a');a.href=u;a.download=f.name;a.click()}})}}
  if(d.day){const n=+d.day;S.selDate=n===0?today():addDays(S.selDate,n);if(S.selDate>today())S.selDate=today();editExp=null;save();render()}
  if(d.statp){S.statP=d.statp;save();render()}
  if(d.selall!=null){const v=d.selall==='1';slip.items.forEach(x=>{if((slip.day||'all')==='all'||x.date===slip.day)x.on=v});render()}
  if(d.selday){const g=slip.items.filter(x=>x.date===d.selday),v=!g.every(x=>x.on);g.forEach(x=>x.on=v);render()}
  if(d.slipday){slip.day=d.slipday;render()}
  if(d.delCard){S.cards=S.cards.filter(x=>x.id!==d.delCard);save();render()}
  if(d.paid){S.ious.forEach(i=>{if(i.name===d.paid&&i.amt-i.paid>0.004){(i.pays=i.pays||[]).push({amt:i.amt-i.paid,date:today()});i.paid=i.amt;i.paidOn=today()}});save();render();toast('ปิดยอดแล้ว')}
  if(d.part){const box=t.closest('.card');if(box.querySelector('.partf'))return;box.insertAdjacentHTML('beforeend',`<form class="row partf"><input inputmode="decimal" placeholder="ยอดที่ได้รับ" aria-label="ยอดที่ได้รับ" style="height:38px"><button class="btn sm">บันทึก</button></form>`);
    box.querySelector('.partf').onsubmit=ev=>{ev.preventDefault();let v=num(ev.target.querySelector('input').value);S.ious.filter(i=>i.name===d.part).sort((a,b)=>a.date<b.date?-1:1).forEach(i=>{const r=Math.min(v,i.amt-i.paid);if(r>0){i.paid+=r;(i.pays=i.pays||[]).push({amt:r,date:today()});if(i.amt-i.paid<=0.004)i.paidOn=today()}v-=r});save();render();toast('บันทึกการรับเงินแล้ว')};box.querySelector('.partf input').focus()}
  if(d.remind){const its=S.ious.filter(i=>i.name===d.remind&&i.amt-i.paid>0);const tot=its.reduce((a,i)=>a+i.amt-i.paid,0);
    const msg=`${d.remind} จ้า ยอดค้างรวม ${fmt(tot)} (${its.map(i=>i.note+' '+fmt(i.amt-i.paid)).join(', ')}) โอนได้ตามสะดวกนะ ขอบคุณ`;
    try{await navigator.clipboard.writeText(msg);toast('คัดลอกแล้ว วางใน LINE ได้เลย')}catch(err){t.insertAdjacentHTML('afterend',`<textarea>${esc(msg)}</textarea>`)}}
  if(d.strat){S.strategy=d.strat;save();render()}
  if(d.theme){S.theme=d.theme;save();render()}
  if(d.sw){S[d.sw]=d.sw==='gsAuto'?S.gsAuto===false:!S[d.sw];save();render()}
  if(d.act==='gsSync')syncSheets(true);
  if(d.delcat!=null){S.cats.splice(+d.delcat,1);editCat=null;save();render()}
  if(d.editcat!=null){editCat=editCat===d.editcat?null:d.editcat;render()}
  if(d.act==='newEmoji'){editCat='__new__';render()}
  if(d.pick){if(editCat==='__new__')newEmoji=d.pick;else if(editCat!=null){fixIcons();S.catIcons[editCat]=d.pick}editCat=null;save();render()}
  if(d.act==='wipeAsk'){document.getElementById('wipeBox').hidden=false;document.getElementById('wipeBox').scrollIntoView({behavior:'smooth',block:'center'})}
  if(d.act==='wipeNo')document.getElementById('wipeBox').hidden=true;
  if(d.act==='wipeYes'){const keep={budget:S.budget,alertPct:S.alertPct,cycleDay:S.cycleDay,cats:S.cats,remindOn:S.remindOn,remindTime:S.remindTime,catIcons:S.catIcons,theme:S.theme,selDate:today()};S={...keep,expenses:[],ious:[],cards:[],slipRefs:[],rules:{},tab:'settings',strategy:'avalanche',payBudget:5000,sample:false};save();render();toast('ล้างข้อมูลแล้ว')}
  if(d.act==='csv'){
    const q=v=>`"${String(v??'').replace(/"/g,'""')}"`;
    const rows=[['ประเภท','วันที่','รายการ','หมวด','ยอด','จ่ายแล้ว']];
    S.expenses.forEach(e=>rows.push(['รายจ่าย',e.date,e.title,e.cat||'',e.amt,'']));
    S.ious.forEach(i=>rows.push(['เพื่อนค้าง: '+i.name,i.date,i.note,'',i.amt,i.paid]));
    S.cards.forEach(c=>rows.push(['บัตรเครดิต','',c.name,`ดอก ${c.apr}% ครบวันที่ ${c.due}`,c.bal,'']));
    const blob=new Blob(['\ufeff'+rows.map(r=>r.map(q).join(',')).join('\n')],{type:'text/csv;charset=utf-8'});
    const f=new File([blob],`kraopaojod-${today()}.csv`,{type:blob.type});
    if(navigator.canShare&&navigator.canShare({files:[f]})){navigator.share({files:[f]}).catch(()=>{})}
    else{const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=f.name;a.click();setTimeout(()=>URL.revokeObjectURL(a.href),4000)}
  }
  if(d.act==='slipSave')saveSlips();
  if(d.act==='slipCancel'){slip.items.forEach(s=>{(S.slipRefs=S.slipRefs||[]).push(s.key)});slip={busy:false,msg:'',items:[],dup:0};save();render()}
  if(d.act==='copy'){const ta=document.getElementById('backup');try{await navigator.clipboard.writeText(ta.value);toast('คัดลอกข้อมูลแล้ว')}catch(err){ta.select()}}
  if(d.act==='restore'){try{const v=JSON.parse(document.getElementById('backup').value);if(!v.expenses)throw 0;S=v;S.tab='home';save();render();toast('กู้คืนแล้ว')}catch(err){toast('ข้อความไม่ถูกต้อง ต้องเป็นข้อมูลที่คัดลอกจากแอปนี้')}}
});
app.addEventListener('submit',e=>{
  e.preventDefault();const f=e.target;
  if(f.id==='addCat'){const v=f.querySelector('#newCat').value.trim();if(v&&!S.cats.includes(v)){S.cats.push(v);fixIcons();S.catIcons[v]=newEmoji;newEmoji='✨';save();render()}return}
  if(f.dataset.split){const e=S.expenses.find(x=>x.id===f.dataset.split);const names=f.querySelector('input').value.trim().split(/[\s,]+/).filter(Boolean);if(e&&names.length){const each=splitExpense(e,names);save();render();toast(`หารแล้ว · เพื่อนค้างคนละ ${fmt(each)}`)}return}
  if(f.id==='quick'){addQuick(f.querySelector('#q').value)}
  if(f.id==='addIou'){if(S.sample)clearSample(false);S.ious.unshift({id:uid(),name:f.querySelector('#in').value.trim(),amt:num(f.querySelector('#ia').value),paid:0,note:f.querySelector('#iw').value.trim()||'ยอดค้าง',date:f.querySelector('#idt').value||today()});save();render();toast('เพิ่มแล้ว')}
  if(f.id==='addCard'){if(S.sample)clearSample(false);S.cards.push({id:uid(),name:f.querySelector('#cn').value.trim(),bal:num(f.querySelector('#cb').value),limit:num(f.querySelector('#cl').value),apr:num(f.querySelector('#ca').value),minPct:num(f.querySelector('#cm').value)||8,due:Math.min(31,Math.max(1,num(f.querySelector('#cd').value)||25))});save();render();toast('เพิ่มบัตรแล้ว')}
});
app.addEventListener('change',e=>{
  const t=e.target;
  if(t.id==='slipPick'){ocrSlips(t.files);t.value='';return}
  if(t.dataset.cat!=null){slip.items[+t.dataset.cat].category=t.value;return}
  if(t.dataset.payee!=null){const x=slip.items[+t.dataset.payee];x.payee=t.value.trim();x.kind=/^(นาย|นาง|น\.ส\.|นางสาว)/.test(x.payee)?'person':'merchant';x.category=guessCat(x.payee)||x.category;render();return}
  if(t.dataset.sp!=null){slip.items[+t.dataset.sp].splitWith=t.value.trim();slip.items[+t.dataset.sp].on=true;render();return}
  if(t.id==='selDate'){S.selDate=t.value&&t.value<=today()?t.value:today();editExp=null;save();render();return}
  if(t.id==='statFrom'||t.id==='statTo'){S[t.id]=t.value;save();render();return}
  if(t.dataset.photo){const f=t.files[0];if(!f)return;compress(f).then(u=>putPhoto(t.dataset.photo,u).then(ok=>{if(ok){PH[t.dataset.photo]=u;render();toast('แนบรูปแล้ว')}else toast('บันทึกรูปไม่ได้ พื้นที่อาจเต็ม')})).catch(()=>toast('เปิดรูปนี้ไม่ได้ ลองรูปอื่น'));return}
  if(t.dataset.f){const e=S.expenses.find(x=>x.id===editExp);if(!e)return;const k=t.dataset.f;e[k]=k==='amt'?num(t.value):t.value;if(k==='cat'&&e.title)(S.rules=S.rules||{})[e.title]=t.value;if(k==='date'){S.selDate=t.value}save();render();return}
  if(t.dataset.slip!=null){slip.items[+t.dataset.slip].on=t.checked;render();return}
  if(t.id==='gsUrl'){S.gsUrl=t.value.trim();save();return}
  if(t.id==='gsSecret'){S.gsSecret=t.value.trim();save();return}
  if(t.id==='alertPct'){S.alertPct=+t.value;save();return}
  if(t.id==='cycleDay'){S.cycleDay=+t.value;save();return}
  if(t.id==='remindTime'){S.remindTime=t.value||'20:00';save();render();return}
  if(t.id==='budget'){S.budget=num(t.value);save();render()}
  if(t.id==='pb'){S.payBudget=num(t.value);save();render()}
  if(t.dataset.bal){const c=S.cards.find(x=>x.id===t.dataset.bal);if(c){c.bal=num(t.value);save();render()}}
});
importFromUrl();render();
window.addEventListener('hashchange',()=>{importFromUrl();render()});
